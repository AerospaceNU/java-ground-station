syntax = "proto3";

option java_package = "com.nuli.proto";
option java_outer_classname = "NULIMessageProto";

import "ReturnCodes.proto";

// This message defines the overarching protocol for communication between
// boards used by NULI in AerospaceNU
message NULIMessage {
  // Used for logging
  optional uint32 timestamp_ms = 1;
  // This should be a monotonically increasing value to identify messages
  optional uint32 message_id = 2;

  oneof payload {
    Commands_Response commands_response = 10;
    Commands_Parameters commands_parameters = 11;
  }

  // Parameters
  message Commands_Parameters {
    oneof parameters {
      Command_Ping_Parameters ping_params = 1;
      Command_GetGPS_Parameters get_gps_params = 2;
      Command_Deploy_Parameters deploy_params = 3;
      Command_GetTelemetry_Parameters get_telemetry_params = 4;
      Command_EraseMemory_Parameters erase_memory_params = 5;
      Command_StartLogging_Parameters start_logging_params = 6;
      Command_StopLogging_Parameters stop_logging_params = 7;
      Command_Servo_SetPosition_Parameters servo_set_position_params = 8;
      Command_SetFactoryMode_Parameters set_factory_mode_params = 9;
    }

    message Command_Ping_Parameters {}
    message Command_GetGPS_Parameters {}
    message Command_Deploy_Parameters {}
    message Command_GetTelemetry_Parameters {}
    message Command_EraseMemory_Parameters {}
    message Command_StartLogging_Parameters {}
    message Command_StopLogging_Parameters {}
    message Command_Servo_SetPosition_Parameters {
      optional float servoPosition = 1;
    }
    message Command_SetFactoryMode_Parameters {
      optional bool enable = 1;
    }
  }

  // Responses
  message Commands_Response {
    optional ReturnCode returnCode = 1;

    oneof response {
      Command_Ping_Response ping_response = 2;
      Command_GetGPS_Response get_gps_response = 3;
      Command_Deploy_Response deploy_response = 4;
      Command_GetTelemetry_Response get_telemetry_response = 5;
      Command_EraseMemory_Response erase_memory_response = 6;
      Command_StartLogging_Response start_logging_response = 7;
      Command_StopLogging_Response stop_logging_response = 8;
      Command_Servo_SetPosition_Response servo_set_position_response = 9;
      Command_SetFactoryMode_Response set_factory_mode_response = 10;
    }

    message Command_Ping_Response {}

    message Command_GetGPS_Response {
      optional float altitude = 1;
      optional float horizontalDilutionOfPrecision = 2;
      optional uint32 fixQuality = 3;
      optional float latitude = 4;
      optional float longitude = 5;
      optional uint32 numSatellites = 6;
    }

    message Command_Deploy_Response {}

    message Command_GetTelemetry_Response {
      optional float accelerationX_mps2 = 1;
      optional float accelerationY_mps2 = 2;
      optional float accelerationZ_mps2 = 3;
      optional float accelerationX_lowPass_mps2 = 4;
      optional float accelerationY_lowPass_mps2 = 5;
      optional float accelerationZ_lowPass_mps2 = 6;
    }

    message Command_EraseMemory_Response {}
    message Command_StartLogging_Response {}
    message Command_StopLogging_Response {}

    message Command_Servo_SetPosition_Response {
      optional float setPosition = 1;
    }

    message Command_SetFactoryMode_Response {}
  }
}